<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>12:12. The first one. · Manifest with Rose</title>
<link rel="icon" href="../../assets/rose-monogram.png">
<style>
@font-face { font-family: "Playfair Display"; src: url(../../fonts/Playfair.ttf); font-weight: 400 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Playfair Display"; src: url(../../fonts/PlayfairItalic.ttf); font-weight: 400 900; font-style: italic; font-display: swap; }
@font-face { font-family: Lora; src: url(../../fonts/Lora-Variable.ttf); font-weight: 400 700; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(../../fonts/Lora-Italic-Variable.ttf); font-weight: 400 700; font-style: italic; font-display: swap; }
@font-face { font-family: "Bebas Neue"; src: url(../../fonts/Bebas.ttf); font-weight: 400; font-display: swap; }

/* Night theme throughout: this page is opened at night, from a lock screen. */
:root {
  --surface-100: #140812; --surface-200: #2a1c30; --surface-300: #3a2842;
  --ink: #faf0e6; --ink-muted: #c9b6c6; --accent: #eab8b3; --kicker: #fad88e;
  --hairline: #ba9860; --action: #fad88e; --on-action: #140812; --focus: #fad88e;
  --display: "Playfair Display", Georgia, serif; --body: Lora, Georgia, serif; --label: "Bebas Neue", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(70% 45% at 50% 38%, rgba(255, 226, 196, .10), rgba(20, 8, 18, 0) 70%), var(--surface-100); color: var(--ink); font: 400 16px/26px var(--body); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { max-width: 520px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right)) 96px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: center; gap: 48px; text-align: center; }
p { margin: 0; }
.mark { font: 400 14px/20px var(--display); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-muted); }
.kicker { display: flex; align-items: center; gap: 16px; font: 400 18px/20px var(--label); letter-spacing: .18em; color: var(--kicker); text-transform: uppercase; }
.kicker::before, .kicker::after { content: ""; width: 32px; height: 1px; background: var(--hairline); }
h1 { margin: 0; font: italic 400 32px/44px var(--display); text-wrap: balance; }

/* the ring is the player: one thin circle, a play button inside, progress drawn on it */
.ring { position: relative; width: 224px; height: 224px; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 2; }
.ring .track { stroke: var(--hairline); opacity: .45; }
.ring .prog { stroke: var(--hairline); stroke-dasharray: 628.3; stroke-dashoffset: 628.3; }
.play { position: absolute; inset: 24px; border-radius: 9999px; border: 0; background: var(--action); color: var(--on-action); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px rgba(255, 226, 196, .45); }
.play svg { position: static; width: 36px; height: 36px; transform: none; fill: currentColor; }
.play[disabled] { background: var(--surface-300); color: var(--ink-muted); box-shadow: none; cursor: default; }
.time { font: 400 28px/28px var(--label); letter-spacing: .08em; color: var(--ink-muted); min-height: 28px; }
.notes { text-align: left; background: var(--surface-200); border-radius: 12px; padding: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, .45); width: 100%; }
.notes pre { margin: 0; white-space: pre-wrap; font: inherit; }
.pending { font-style: italic; color: var(--ink-muted); }
a { color: var(--accent); }
.fine { font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <p class="mark">Manifest with Rose</p>
  <p class="kicker">12/12 Portal</p>
  <h1>12:12. The first one.</h1>

  <div class="ring">
    <svg viewBox="0 0 224 224" aria-hidden="true"><circle class="track" cx="112" cy="112" r="100"/><circle class="prog" id="prog" cx="112" cy="112" r="100"/></svg>
    <button class="play" id="play" type="button" disabled aria-label="Play">
      <svg viewBox="0 0 24 24" id="icon" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>
  <p class="time" id="time" aria-live="off">Rose is still recording this one.</p>
  

  <section class="notes" aria-label="Tonight's note"><pre>If you&#x27;re awake: one slow breath in, say the wish once, go back to sleep.

If you slept through this, you are not late. The second one is at noon.</pre></section>
  <p class="fine"><a href="../../">All of December</a> · manifest.with.rose</p>
</main>
<script>
(function () {
  var a = document.getElementById('audio'); if (!a) return;
  var play = document.getElementById('play'), icon = document.getElementById('icon'), prog = document.getElementById('prog'), time = document.getElementById('time');
  var PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  play.onclick = function () { a.paused ? a.play() : a.pause(); };
  a.onplay = function () { icon.firstElementChild.setAttribute('d', PAUSE); play.setAttribute('aria-label', 'Pause'); };
  a.onpause = function () { icon.firstElementChild.setAttribute('d', PLAY); play.setAttribute('aria-label', 'Play'); };
  a.ontimeupdate = function () { if (a.duration) { prog.style.strokeDashoffset = 628.3 * (1 - a.currentTime / a.duration); time.textContent = mmss(a.currentTime) + ' / ' + mmss(a.duration); } };
  a.onloadedmetadata = function () { time.textContent = mmss(a.duration); };
})();
</script>
</body>
</html>
